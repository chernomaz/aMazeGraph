      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9014"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-send:9014/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
