name: amazegraph-remote-langgraph

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    environment:
      REDIS_URL: redis://127.0.0.1:6379
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8011:8001"
      - "16696:16686"
      - "6380:6379"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8001/health',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  remote-research:
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.research_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9002"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-research:9002/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    ports:
      - "9012:9002"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9002/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  remote-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.writer_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9003"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-writer:9003/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    ports:
      - "9013:9003"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9003/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    profiles: [sprint2]
    # Vendored from /home/ubuntu/data/cloude/newAmazeControlPlane/aMaze/examples/mcp_server/
    # FastMCP streamable-http server; auto-discovers @tool functions in tools/*.py.
    build:
      context: ..
      dockerfile: examples/mcp_server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      # FastMCP streamable-http only answers POST on /; TCP-connect probe is sufficient.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sprint 3 nodes ──────────────────────────────────────────────────────────

  remote-s3:
    profiles: [sprint3]
    # ST-RLG-15..18: subgraph (cases 19+20), counter (case 25), schema_remote (case 28)
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.subgraph_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9008"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-s3:9008/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9008/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  remote-s3-counter:
    profiles: [sprint3]
    # counter node for recursion/step metadata (case 25)
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.counter_node
    environment:
