      timeout: 3s
      retries: 30

  pipeline-demo:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    command: ["python", "-m", "examples.pipeline_demo", "LangGraph remote node execution"]
    depends_on:
      orchestrator:
        condition: service_healthy
      remote-research:
        condition: service_healthy
      remote-writer:
        condition: service_healthy
      remote-planner:
        condition: service_healthy
    restart: "no"

  # Sprint 5 nodes ──────────────────────────────────────────────────────────

  remote-send:
    profiles: [sprint5]
    build:
