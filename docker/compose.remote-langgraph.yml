name: amazegraph-remote-langgraph

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    environment:
      REDIS_URL: redis://127.0.0.1:6379
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8011:8001"
      - "16696:16686"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8001/health',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-research:
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.research_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9002"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-research:9002/invoke
    ports:
      - "9012:9002"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9002/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.writer_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9003"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-writer:9003/invoke
    ports:
      - "9013:9003"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9003/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    profiles: [sprint2]
    # Vendored from /home/ubuntu/data/cloude/newAmazeControlPlane/aMaze/examples/mcp_server/
    # FastMCP streamable-http server; auto-discovers @tool functions in tools/*.py.
    build:
      context: ..
      dockerfile: examples/mcp_server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      # FastMCP streamable-http only answers POST on /; TCP-connect probe is sufficient.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sprint 3 nodes ──────────────────────────────────────────────────────────

  a2a-s3:
    profiles: [sprint3]
    # ST-RLG-15..18: subgraph (cases 19+20), counter (case 25), schema_remote (case 28)
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.subgraph_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9008"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-s3:9008/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9008/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-s3-counter:
    profiles: [sprint3]
    # counter node for recursion/step metadata (case 25)
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.counter_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9009"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-s3-counter:9009/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9009/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-s3-schema:
    profiles: [sprint3]
    # schema_remote node for input/output/private schemas demo (case 28)
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.schema_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9010"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-s3-schema:9010/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9010/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sprint 4 nodes ──────────────────────────────────────────────────────────

  a2a-command:
    profiles: [sprint4]
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.command_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9011"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-command:9011/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9011/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sprint 2 nodes ──────────────────────────────────────────────────────────

  a2a-llm-tool:
    profiles: [sprint2]
    # ST-RLG-9: real OpenAI ChatOpenAI + MCP web_search
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.llm_tool_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9004"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-llm-tool:9004/invoke
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MCP_URL: http://mcp:8000/mcp
    depends_on:
      orchestrator:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9004/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-audit:
    profiles: [sprint2]
    # ST-RLG-10, ST-RLG-12: audit no-op + config_echo handlers (single container)
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.audit_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9005"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-audit:9005/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9005/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-research-a:
    profiles: [sprint2]
    # ST-RLG-13: parallel fan-out branch A
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.research_a_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9006"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-research-a:9006/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9006/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  a2a-research-b:
    profiles: [sprint2]
    # ST-RLG-13: parallel fan-out branch B
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-node
      args:
        NODE_MODULE: examples.a2a_nodes.research_b_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      A2A_NODE_HOST: 0.0.0.0
      A2A_NODE_PORT: "9007"
      A2A_NODE_PUBLIC_ENDPOINT: http://a2a-research-b:9007/invoke
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9007/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  main-langgraph:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Sprint 2: passed through for the demo's optional LangSmith tracing
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    depends_on:
      orchestrator:
        condition: service_healthy
      a2a-research:
        condition: service_healthy
      a2a-writer:
        condition: service_healthy
    restart: "no"
