    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.research_a_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9006"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-research-a:9006/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
