      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9009"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-s3-counter:9009/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9009/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  remote-s3-schema:
    profiles: [sprint3]
    # schema_remote node for input/output/private schemas demo (case 28)
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote-node
      args:
        NODE_MODULE: examples.remote_nodes.schema_node
    environment:
      AMAZE_ORCHESTRATOR_URL: http://orchestrator:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://orchestrator:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AMAZE_NODE_HOST: 0.0.0.0
      AMAZE_NODE_PORT: "9010"
      AMAZE_NODE_PUBLIC_ENDPOINT: http://remote-s3-schema:9010/invoke
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-aMazeGraph}
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9010/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pipeline demo ──────────────────────────────────────────────────────────

  remote-planner:
    profiles: [pipeline]
    build:
